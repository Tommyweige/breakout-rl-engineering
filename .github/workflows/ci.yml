name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Unit tests and smoke (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The PER baseline audit reads the pinned Day 20 manifest out of git
          # (`git show <commit>:experiments/...`) and checks that commit is an
          # ancestor of HEAD. The default depth-1 clone has neither.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenCV runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1 libgl1 libglib2.0-0 libxext6 libsm6 libice6

      - name: Install the verified CPU dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0+cpu"
          python -m pip install \
            "ale-py==0.12.0" \
            "gymnasium==1.3.0" \
            "onnx==1.19.0" \
            "onnxruntime==1.31.1" \
            "numpy==2.5.4" \
            "matplotlib==3.11.2" \
            "pillow==13.0.0" \
            "opencv-python==5.0.0.93"

      - name: Verify that the ALE Breakout ROM is bundled
        run: |
          python - <<'PY'
          from pathlib import Path
          import ale_py

          rom = Path(ale_py.__file__).resolve().parent / "roms" / "breakout.bin"
          assert rom.is_file(), f"missing ROM: {rom}"
          assert rom.stat().st_size == 2048, rom.stat().st_size
          print(f"ALE {ale_py.__version__} bundles {rom} ({rom.stat().st_size} bytes)")
          PY

      - name: Unit tests
        run: python -m scripts.smoke.run_smoke --units-only

      - name: End-to-end smoke (400 training steps + one evaluation)
        run: python -m scripts.smoke.run_smoke --e2e-only --output-dir outputs/smoke

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts-${{ github.run_id }}
          path: outputs/smoke
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Build the browser application
        run: npm run build
