name: Day 8 runtime evidence

on:
  push:
    branches:
      - codex/issue-10-day8

permissions:
  contents: write

jobs:
  validate-and-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-10-day8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Day 8 runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.5.2" "pillow==12.3.0" "gymnasium==1.3.0" "ale-py==0.12.0" "opencv-python==5.0.0.93"
          python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Run Day 8 tests
        run: python -m unittest discover -s tests -v

      - name: Capture inspection and visualization
        run: |
          mkdir -p assets/day08
          python inspect_dqn_network.py --device cpu --seed 42 | tee assets/day08/dqn-inspection.txt
          python visualize_dqn_network.py --device cpu --seed 42

      - name: Commit reproducible runtime evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/day08/dqn-inspection.txt assets/day08/dqn-q-values.png assets/day08/dqn-q-values.json
          if git diff --cached --quiet; then
            echo "No runtime evidence changes to commit."
          else
            git commit -m "Day 8: record runtime DQN evidence"
            git push origin HEAD:codex/issue-10-day8
          fi
