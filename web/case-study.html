    <script>
      // Apply the saved theme before the first paint so a reload never flashes the other one.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem('breakout-theme');
        } catch {
          saved = null;
        }
        const choice = saved === 'light' || saved === 'dark' ? saved : null;
        const theme =
          choice ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === 'dark' ? meta.dataset.dark : meta.dataset.light;
      })();
    </script>
