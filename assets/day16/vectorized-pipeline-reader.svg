<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <style>
      .title{font:700 42px system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;fill:#111827}
      .lane{font:700 25px system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;fill:white}
      .box{fill:#f8fbff;stroke:#2563eb;stroke-width:2.5;rx:16}
      .green{fill:#f7fcf7;stroke:#4b8f45;stroke-width:2.5;rx:16}
      .txt{font:600 21px system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;fill:#111827;text-anchor:middle}
      .small{font:500 17px system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;fill:#374151;text-anchor:middle}
      .note{fill:#ffffff;stroke:#3b82f6;stroke-width:2;stroke-dasharray:8 6;rx:14}
      .noteText{font:600 18px system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;fill:#1f2937;text-anchor:middle}
      .footer{font:600 20px system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;fill:#1f2937;text-anchor:middle}
      .arrow{stroke:#1f2937;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#3b82f6;stroke-width:2;fill:none;stroke-dasharray:7 6}
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>
  <text x="720" y="68" class="title" text-anchor="middle">Day 16｜向量化 DQN Trainer 資料流</text>

  <rect x="44" y="112" width="150" height="56" rx="14" fill="#2563eb"/>
  <text x="119" y="149" class="lane" text-anchor="middle">環境互動</text>

  <rect x="40" y="215" width="175" height="120" class="box"/>
  <text x="127" y="260" class="txt"><tspan x="127">多個 Breakout</tspan><tspan x="127" dy="30">環境</tspan><tspan x="127" dy="30" class="small">Env 0｜Env 1｜…</tspan></text>

  <rect x="250" y="215" width="175" height="120" class="box"/>
  <text x="337" y="263" class="txt"><tspan x="337">觀測值批次</tspan><tspan x="337" dy="34" class="small">(N, 4, 84, 84)</tspan></text>

  <rect x="460" y="215" width="185" height="120" class="box"/>
  <text x="552" y="257" class="txt"><tspan x="552">DQN（CUDA）</tspan><tspan x="552" dy="32" class="small">一次批次 forward</tspan></text>

  <rect x="680" y="215" width="155" height="120" class="box"/>
  <text x="757" y="263" class="txt"><tspan x="757">動作批次</tspan><tspan x="757" dy="34" class="small">(N,)</tspan></text>

  <rect x="870" y="215" width="175" height="120" class="box"/>
  <text x="957" y="283" class="txt">env.step(actions)</text>

  <rect x="1080" y="215" width="190" height="120" class="box"/>
  <text x="1175" y="254" class="txt"><tspan x="1175">Transition 批次</tspan><tspan x="1175" dy="30" class="small">state / action / reward</tspan><tspan x="1175" dy="25" class="small">next_state / done</tspan></text>

  <rect x="1300" y="215" width="120" height="120" class="box"/>
  <text x="1360" y="262" class="txt"><tspan x="1360">GPU</tspan><tspan x="1360" dy="31">Replay</tspan><tspan x="1360" dy="31">Buffer</tspan></text>

  <path d="M215 275 H247" class="arrow"/><path d="M425 275 H457" class="arrow"/><path d="M645 275 H677" class="arrow"/><path d="M835 275 H867" class="arrow"/><path d="M1045 275 H1077" class="arrow"/><path d="M1270 275 H1297" class="arrow"/>

  <rect x="180" y="395" width="310" height="88" class="note"/>
  <text x="335" y="430" class="noteText"><tspan x="335">一次 vector step 收集 N 筆 transition</tspan><tspan x="335" dy="28">訓練進度仍以 transition 數計算</tspan></text>
  <path d="M290 335 C290 365 275 370 275 395" class="dash"/>

  <rect x="810" y="395" width="290" height="88" class="note"/>
  <text x="955" y="430" class="noteText"><tspan x="955">某個環境結束時</tspan><tspan x="955" dy="28">只重設那個環境</tspan></text>
  <path d="M957 335 V395" class="dash"/>

  <rect x="44" y="548" width="150" height="56" rx="14" fill="#2563eb"/>
  <text x="119" y="585" class="lane" text-anchor="middle">模型更新</text>

  <rect x="990" y="655" width="230" height="100" class="green"/>
  <text x="1105" y="714" class="txt">隨機抽樣 mini-batch</text>

  <rect x="720" y="655" width="230" height="100" class="green"/>
  <text x="835" y="699" class="txt"><tspan x="835">計算 Q-value</tspan><tspan x="835" dy="31">與 target</tspan></text>

  <rect x="450" y="655" width="230" height="100" class="green"/>
  <text x="565" y="714" class="txt">loss + optimizer step</text>

  <rect x="180" y="655" width="230" height="100" class="green"/>
  <text x="295" y="714" class="txt">更新 Online Network</text>

  <path d="M1360 335 V610 H1105 V652" class="arrow"/>
  <path d="M990 705 H953" class="arrow"/><path d="M720 705 H683" class="arrow"/><path d="M450 705 H413" class="arrow"/>

  <line x1="44" y1="815" x2="1396" y2="815" stroke="#d1d5db" stroke-width="2"/>
  <text x="720" y="862" class="footer">重點：把多個 observation 合成 batch，一次交給 GPU，減少零碎 inference 與資料寫入。</text>
</svg>