<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1243" viewBox="0 0 1200 1243">
<title>Day 8 DQN forward flow</title>
<desc>Rendered flow from a Breakout state to raw Q-values and argmax action selection.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Day 8 — DQN forward path</text>
<rect x="220" y="48" rx="14" ry="14" width="760" height="88" fill="#eef4fa" stroke="#555" stroke-width="1.5"/>
<text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">Breakout state</text>
<text x="600" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">(4, 84, 84) uint8</text>
<line x1="600" y1="140" x2="600" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="178" rx="14" ry="14" width="760" height="88" fill="#eef4fa" stroke="#555" stroke-width="1.5"/>
<text x="600" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">observation_to_tensor()</text>
<text x="600" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">float32 / 255 + batch dim</text>
<line x1="600" y1="270" x2="600" y2="300" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="308" rx="14" ry="14" width="760" height="88" fill="#eef4fa" stroke="#555" stroke-width="1.5"/>
<text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">AtariFeatureExtractor</text>
<text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">CNN: Conv1 → Conv2 → Conv3</text>
<line x1="600" y1="400" x2="600" y2="430" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="438" rx="14" ry="14" width="760" height="88" fill="#eef4fa" stroke="#555" stroke-width="1.5"/>
<text x="600" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">CNN features</text>
<text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">(B, 3136)</text>
<line x1="600" y1="530" x2="600" y2="560" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="568" rx="14" ry="14" width="760" height="88" fill="#f6f0fb" stroke="#555" stroke-width="1.5"/>
<text x="600" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">Fully connected head</text>
<text x="600" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">Linear 3136 → 512 + ReLU</text>
<line x1="600" y1="660" x2="600" y2="690" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="698" rx="14" ry="14" width="760" height="88" fill="#f6f0fb" stroke="#555" stroke-width="1.5"/>
<text x="600" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">Raw Q-values</text>
<text x="600" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">Linear 512 → num_actions = 4</text>
<line x1="600" y1="790" x2="600" y2="820" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="828" rx="14" ry="14" width="760" height="88" fill="#f6f0fb" stroke="#555" stroke-width="1.5"/>
<text x="600" y="860" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">Action values</text>
<text x="600" y="890" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">Q(NOOP)  Q(FIRE)  Q(RIGHT)  Q(LEFT)</text>
<line x1="600" y1="920" x2="600" y2="950" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="958" rx="14" ry="14" width="760" height="88" fill="#fff4e5" stroke="#555" stroke-width="1.5"/>
<text x="600" y="990" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">argmax</text>
<text x="600" y="1020" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">select index of largest Q-value</text>
<line x1="600" y1="1050" x2="600" y2="1080" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="1088" rx="14" ry="14" width="760" height="88" fill="#fff4e5" stroke="#555" stroke-width="1.5"/>
<text x="600" y="1120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">Greedy action</text>
<text x="600" y="1150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">still meaningless before training</text>
</svg>
