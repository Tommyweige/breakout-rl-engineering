<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <style>
    .t { font-family: Arial, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; fill:#111827; }
    .title { font-size: 46px; font-weight: 800; }
    .subtitle { font-size: 24px; fill:#4b5563; }
    .h { font-size: 32px; font-weight: 800; fill:#fff; }
    .boxTitle { font-size: 23px; font-weight: 700; }
    .body { font-size: 21px; }
    .small { font-size: 18px; }
    .formula { font-size: 22px; font-weight: 700; }
    .summaryH { font-size: 25px; font-weight: 800; }
  </style>

  <text x="700" y="62" text-anchor="middle" class="t title">DQN vs Double DQN：差別在哪裡？</text>
  <text x="700" y="102" text-anchor="middle" class="t subtitle">關鍵差在 next state 的 target 怎麼算。</text>

  <rect x="35" y="135" width="645" height="585" rx="24" fill="#f8fbff" stroke="#2563eb" stroke-width="4"/>
  <rect x="190" y="120" width="335" height="68" rx="20" fill="#2563eb"/>
  <text x="357" y="165" text-anchor="middle" class="t h">DQN</text>

  <rect x="110" y="210" width="495" height="58" rx="14" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
  <text x="358" y="247" text-anchor="middle" class="t boxTitle">next state s'</text>
  <path d="M358 269 L358 300" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="110" y="305" width="495" height="82" rx="14" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
  <text x="358" y="338" text-anchor="middle" class="t boxTitle">Target Network</text>
  <text x="358" y="369" text-anchor="middle" class="t body">輸出 Q_target(s', a)</text>
  <path d="M358 388 L358 420" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="90" y="425" width="535" height="92" rx="14" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
  <text x="358" y="459" text-anchor="middle" class="t boxTitle">直接取最大值</text>
  <text x="358" y="493" text-anchor="middle" class="t formula">max_a Q_target(s', a)</text>
  <path d="M358 519 L358 548" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="75" y="553" width="565" height="82" rx="14" fill="#e9f2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="358" y="586" text-anchor="middle" class="t boxTitle">Bellman target</text>
  <text x="358" y="618" text-anchor="middle" class="t formula">y = r + γ · max_a Q_target(s', a)</text>

  <rect x="80" y="655" width="555" height="42" rx="12" fill="#fff7df" stroke="#d97706" stroke-width="2"/>
  <text x="358" y="683" text-anchor="middle" class="t small">同一組估計同時負責：選動作 + 評估價值</text>

  <rect x="720" y="135" width="645" height="585" rx="24" fill="#f7fdf8" stroke="#16a34a" stroke-width="4"/>
  <rect x="865" y="120" width="355" height="68" rx="20" fill="#16a34a"/>
  <text x="1042" y="165" text-anchor="middle" class="t h">Double DQN</text>

  <rect x="805" y="210" width="475" height="58" rx="14" fill="#effaf1" stroke="#16a34a" stroke-width="2"/>
  <text x="1042" y="247" text-anchor="middle" class="t boxTitle">next state s'</text>

  <path d="M1042 269 L1042 292 L900 292 L900 315" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M1042 269 L1042 292 L1185 292 L1185 315" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>

  <rect x="755" y="320" width="290" height="120" rx="14" fill="#effaf1" stroke="#16a34a" stroke-width="2"/>
  <text x="900" y="355" text-anchor="middle" class="t boxTitle">Online Network</text>
  <text x="900" y="389" text-anchor="middle" class="t body">先選 action</text>
  <text x="900" y="420" text-anchor="middle" class="t formula">a* = argmax_a Q_online(s', a)</text>

  <rect x="1065" y="320" width="280" height="120" rx="14" fill="#effaf1" stroke="#16a34a" stroke-width="2"/>
  <text x="1205" y="355" text-anchor="middle" class="t boxTitle">Target Network</text>
  <text x="1205" y="389" text-anchor="middle" class="t body">只評估剛剛選出的 a*</text>
  <text x="1205" y="420" text-anchor="middle" class="t formula">Q_target(s', a*)</text>

  <path d="M900 441 L900 473 L1042 473 L1042 500" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M1205 441 L1205 473 L1042 473" stroke="#16a34a" stroke-width="4" fill="none"/>

  <rect x="770" y="505" width="545" height="100" rx="14" fill="#eaf8ed" stroke="#16a34a" stroke-width="2"/>
  <text x="1042" y="540" text-anchor="middle" class="t boxTitle">Bellman target</text>
  <text x="1042" y="577" text-anchor="middle" class="t formula">y = r + γ · Q_target(s', argmax_a Q_online(s', a))</text>

  <rect x="780" y="625" width="525" height="72" rx="12" fill="#eaf8ed" stroke="#16a34a" stroke-width="2"/>
  <text x="1042" y="655" text-anchor="middle" class="t body">Online 負責「選」，Target 負責「評」</text>
  <text x="1042" y="683" text-anchor="middle" class="t small" fill="#166534">→ 降低被偶然偏高 Q-value 誤導的機會</text>

  <rect x="35" y="755" width="1330" height="110" rx="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <line x1="475" y1="770" x2="475" y2="850" stroke="#d1d5db" stroke-width="2"/>
  <line x1="925" y1="770" x2="925" y2="850" stroke="#d1d5db" stroke-width="2"/>

  <text x="250" y="792" text-anchor="middle" class="t summaryH" fill="#1d4ed8">核心差別</text>
  <text x="250" y="822" text-anchor="middle" class="t small">DQN：同一份估計又選又評</text>
  <text x="250" y="848" text-anchor="middle" class="t small">Double DQN：Online 選，Target 評</text>

  <text x="700" y="792" text-anchor="middle" class="t summaryH" fill="#15803d">Double DQN 的好處</text>
  <text x="700" y="822" text-anchor="middle" class="t small">降低 overestimation bias、target 較穩</text>
  <text x="700" y="848" text-anchor="middle" class="t small">更不容易被「剛好高估」的最大值帶偏</text>

  <text x="1145" y="792" text-anchor="middle" class="t summaryH" fill="#c2410c">一句話記住</text>
  <text x="1145" y="830" text-anchor="middle" class="t body">Double DQN = 把「選擇」和「評估」拆開</text>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
